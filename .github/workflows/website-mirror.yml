
name: Website Mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack

      - name: Create output directory
        run: mkdir -p website-copy

      - name: Download authorized public pages
        timeout-minutes: 100
        run: |
          httrack "https://tractorgyan.com/" \
            -O "./website-copy" \
            "+tractorgyan.com/*" \
            "-*/logout*" \
            -r3 \
            -v

      - name: Check downloaded files
        if: always()
        run: |
          echo "Checking downloaded files..."
          find website-copy -type f | head -100
          echo "Total files:"
          find website-copy -type f | wc -l
          echo "Directory size:"
          du -sh website-copy || true

      - name: Upload website as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-copy
          path: website-copy/
          if-no-files-found: warn
          retention-days: 3
