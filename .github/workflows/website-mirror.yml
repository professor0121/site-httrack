
name: Website Mirror

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack

      - name: Create output directory
        run: mkdir -p website-copy

      - name: Mirror TheWebTab website
        timeout-minutes: 100
        continue-on-error: true
        run: |
          set -o pipefail

          httrack "https://www.thewebtab.com/" \
            -O "./website-copy" \
            "-*" \
            "+www.thewebtab.com/*" \
            "+thewebtab.com/*" \
            --depth=3 \
            --sockets=4 \
            --retries=2 \
            --timeout=30 \
            --max-time=6000 \
            --max-rate=500000 \
            --connection-per-second=2 \
            --extended-parsing \
            --keep-links=0 \
            --robots \
            -v 2>&1 | tee website-copy/mirror.log

      - name: Verify downloaded website
        if: always()
        run: |
          echo "Checking downloaded files..."

          find website-copy -type f | head -100

          echo ""
          echo "Total files:"
          find website-copy -type f | wc -l

          echo ""
          echo "HTML files:"
          find website-copy -type f \
            \( -iname "*.html" -o -iname "*.htm" \) | head -50

          echo ""
          echo "Directory size:"
          du -sh website-copy || true

      - name: Upload website mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thewebtab-website-copy
          path: website-copy/
          if-no-files-found: warn
          retention-days: 3
